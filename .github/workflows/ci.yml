# Gates: tools (ruff check + format + ld-task tests), api (full pytest suite),
# web (npm ci, build, node tests), large-files (new data, weights or big blobs).
# API ruff is still the pending lint chore in progress.md:181; until it lands the
# api job runs tests only and the tools job lints tools/ only.
name: CI

on:
  push:
    branches:
      - main
      - feat/labeldesk-v2
      - "task/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep these two paths in sync with FRONTEND_APP / BACKEND_APP in tools/ld-task.
env:
  FRONTEND_APP: apps/frontend
  BACKEND_APP: apps/backend

jobs:
  tools:
    name: tools and ld-task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check ruff pytest pyyaml
      - name: Lint tools
        run: ruff check --line-length=120 tools/ld-task tools
      - name: Check formatting
        run: ruff format --check --line-length=120 tools/ld-task tools
      - name: Test ld-task in throwaway worktrees
        run: pytest tools/tests -q

  api:
    name: api tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_APP }}/requirements.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install CPU torch
        run: >-
          python -m pip install --disable-pip-version-check torch torchvision
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r "$BACKEND_APP/requirements.txt"
      - name: Run the API test suite
        working-directory: ${{ env.BACKEND_APP }}
        run: python -m pytest -q

  web:
    name: web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_APP }}/package-lock.json
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_APP }}
        run: npm ci
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_APP }}
        run: npm run build
      - name: Test frontend
        working-directory: ${{ env.FRONTEND_APP }}
        run: npm test

  large-files:
    name: large files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject added data, weights and large files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_large_files.py --base "$BASE_SHA" --head HEAD

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: pure-function unit tests (no GPU, no network, no heavy deps)
    integration: end-to-end tests requiring GPU, checkpoint, or trained models
    static: static-analysis / config-file scans (no code execution)
addopts = -ra --strict-markers

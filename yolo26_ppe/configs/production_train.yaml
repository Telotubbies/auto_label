# YOLO26 PPE — Training config
# 4 models: yolo26n/s detect + yolo26n/s-seg

# Common training args
epochs: 150
imgsz: 640
batch: 16
patience: 30          # early stopping if no improvement
freeze: 10            # freeze backbone (480 images = small dataset)
cls_pw: 0.5           # class weight (imbalance 10.5:1 after oversampling)

# Optimizer (YOLO26 default: MuSGD)
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5              # repurposed as L1 loss in YOLO26 (no DFL)

# Focal Loss — helps with class imbalance + hard examples.
# Applied via focal_patch.py monkey-patch (gamma=1.5, alpha=0.25).
# focal_patch.py replaces v8DetectionLoss.bce with FocalBCE on import.
# fl_gamma is logged to MLflow for tracking only (not a valid Ultralytics arg).
fl_gamma: 1.5         # ← Focal Loss gamma (applied via focal_patch.py)

# Gradient Accumulation — simulate larger batch without more VRAM.
# Ultralytics uses `nbs` (nominal batch size): accumulation = nbs / batch.
# Example: batch=16, nbs=64 → 4 accumulation steps → effective batch 64.
# Set nbs = batch to disable accumulation.
nbs: 64               # ← effective batch size (batch=16 → 4x accumulation)

# Mixed precision (AMP) — fp16 for speed + memory, fp32 master weights.
# Enabled by default in Ultralytics. Set false only for debugging.
amp: true

# Save + val
save: true
save_period: -1       # save best only
val: true
plots: true
exist_ok: true

# Models
models:
  nano_detection:
    weights: yolo26n.pt
    task: detect
    data: yolo26_ppe/data/yolo_detection_dataset_version_2/data.yaml
    project: yolo26_ppe/models/production/nano_detection

  small_detection:
    weights: yolo26s.pt
    task: detect
    data: yolo26_ppe/data/yolo_detection_dataset_version_2/data.yaml
    project: yolo26_ppe/models/production/small_detection

  nano_segmentation:
    weights: yolo26n-seg.pt
    task: segment
    data: yolo26_ppe/data/yolo_segmentation_dataset_version_2/data.yaml
    project: yolo26_ppe/models/production/nano_segmentation

  small_segmentation:
    weights: yolo26s-seg.pt
    task: segment
    data: yolo26_ppe/data/yolo_segmentation_dataset_version_2/data.yaml
    project: yolo26_ppe/models/production/small_segmentation

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix", "--line-length=120"]
        files: ^(tools/(ld-task|.*\.py)|(apps/(api|worker|inference)|tests|ml)/.*\.py)$
      - id: ruff-format
        args: ["--line-length=120"]
        files: ^(tools/(ld-task|.*\.py)|(apps/(api|worker|inference)|tests|ml)/.*\.py)$

  - repo: local
    hooks:
      - id: ld-task-tests
        name: ld-task throwaway worktree tests
        entry: python -m pytest tools/tests -q
        language: system
        pass_filenames: false
        stages: [pre-push]

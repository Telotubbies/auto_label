default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3                     # keep in step with the CI pin (ruff==0.17.3)
    hooks:
      # ruff-check covers apps/backend too; its rule set lives in ruff.toml.
      # ruff-format stays on tools/ only: formatting 271 backend files at once
      # would bury every review of this branch.
      - id: ruff-check
        args: ["--fix", "--line-length=120"]
        files: ^(tools/|apps/backend/)
      - id: ruff-format
        args: ["--line-length=120"]
        files: ^tools/

  - repo: local
    hooks:
      - id: ld-task-tests
        name: ld-task throwaway worktree tests
        entry: python -m pytest tools/tests -q
        language: system
        pass_filenames: false
        stages: [pre-push]

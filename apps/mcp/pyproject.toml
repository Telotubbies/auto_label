[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labeldesk-mcp"
version = "0.1.0"
description = "LabelDesk's MCP server: the labeling API as agent tools"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "labeldesk-sdk", "httpx>=0.27"]

[project.scripts]
labeldesk-mcp = "labeldesk_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["labeldesk_mcp*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labeldesk-sdk"
version = "0.1.0"
description = "LabelDesk developer API client and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
labeldesk = "labeldesk.cli:main"

[tool.setuptools]
packages = ["labeldesk"]
